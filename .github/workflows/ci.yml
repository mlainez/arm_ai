name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test_host:
    name: "test ${{ matrix.os }} (otp-${{ matrix.otp }}/elixir-${{ matrix.elixir }})"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Matches the official Nerves systems (nerves_system_br 1.35).
        include:
          - os: ubuntu-24.04
            otp: "29.1.1"
            elixir: "1.20.4"
          - os: macos-14
            otp: "29.1.1"
            elixir: "1.20.4"

    env:
      ARM_AI_BUILD: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: mix deps.get

      - name: Run tests
        run: mix test --warnings-as-errors

  cross_build:
    name: "cross-build ${{ matrix.target }}"
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabihf

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Cross-compile NIF
        working-directory: native/arm_ai_nif
        run: cross build --release --target ${{ matrix.target }}
