[package]
name = "nx_arm_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "nx_arm_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.36"
rayon = "1.10"
memmap2 = "0.9"

# Core: small, always-on deps. ~1 MB of binary.
gemm = "0.18"
half = "2"
fast_image_resize = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
safetensors = "0.4"

# LLM inference. ~3 MB of binary on top.
candle-core = { version = "0.8", default-features = false, optional = true }
candle-transformers = { version = "0.8", default-features = false, optional = true }
candle-nn = { version = "0.8", default-features = false, optional = true }

# Tokenization. ~1 MB of binary on top. Required when llm is on.
tokenizers = { version = "0.20", default-features = false, features = ["onig"], optional = true }

# Generic ONNX runtime in pure Rust with ARM NEON. ~20 MB of binary —
# the heaviest crate in this stack. Only pulled in when `onnx` feature
# is enabled.
tract-onnx = { version = "0.21", default-features = false, optional = true }

[features]
default = ["llm", "onnx"]
# All-rust LLM stack: candle + tokenizers.
llm = ["dep:candle-core", "dep:candle-transformers", "dep:candle-nn", "dep:tokenizers"]
# tract-onnx — the universal HuggingFace model path. Heavy.
onnx = ["dep:tract-onnx"]
