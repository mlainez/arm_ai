[package]
name = "nx_arm_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "nx_arm_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.36"
rayon = "1.10"
memmap2 = "0.9"

# Upstream ML / numeric stack. Per the "use the crate if it's
# faster, smaller, or better-maintained" policy.
candle-core = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false }
candle-nn = { version = "0.8", default-features = false }
# Production f32/f64 GEMM with NEON tuning. Drops our hand-rolled
# matmul kernels (~700 LOC).
gemm = "0.18"
# IEEE 754 half-precision types. Drops our manual f16 bit-twiddling.
half = "2"
# SIMD image resize. Drops the bilinear resize NIF.
fast_image_resize = "5"
# Generic image I/O for vision pipelines.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# SafeTensors reader. Drops lib/nx_arm/safetensors.ex.
safetensors = "0.4"
# HuggingFace tokenizers — fast BPE/WordPiece/SentencePiece. Lets
# the LLM API take strings instead of token IDs.
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
